  - name: Ensure jq is installed
    run: |
      sudo apt-get update
      sudo apt-get install -y jq

  - name: Query GitHub GraphQL for public/private repositories contributed count
    env:
      TOKEN: ${{ secrets.PERSONAL_TOKEN }}
      GITHUB_USER: ${{ env.GITHUB_USER }}
    run: |
      if [ -z "$TOKEN" ]; then
        echo "ERROR: secret PERSONAL_TOKEN is not set"
        exit 1
      fi

      # Build JSON payload safely
      PAYLOAD="{\"query\":\"query { user(login: \\\"${GITHUB_USER}\\\") { private: repositoriesContributedTo(privacy:PRIVATE) { totalCount } public: repositoriesContributedTo(privacy:PUBLIC) { totalCount } } }\" }"

      resp=$(curl -s -H "Authorization: bearer $TOKEN" -X POST -d "$PAYLOAD" https://api.github.com/graphql)
      private_count=$(echo "$resp" | jq -r '.data.user.private.totalCount // 0')
      public_count=$(echo "$resp" | jq -r '.data.user.public.totalCount // 0')

      echo "PRIVATE_REPOS_COUNT=$private_count" >> $GITHUB_ENV
      echo "PUBLIC_REPOS_COUNT=$public_count" >> $GITHUB_ENV
      echo "Found private: $private_count, public: $public_count"

  - name: Update README placeholders
    env:
      PRIVATE_REPOS_COUNT: ${{ env.PRIVATE_REPOS_COUNT }}
      PUBLIC_REPOS_COUNT: ${{ env.PUBLIC_REPOS_COUNT }}
    run: |
      if [ ! -f README.md ]; then
        echo "README.md not found"
        exit 1
      fi

      perl -0777 -pe "s/<!--PRIVATE_REPOS_COUNT-->.*?<!--END_PRIVATE_REPOS_COUNT-->/<!--PRIVATE_REPOS_COUNT-->${PRIVATE_REPOS_COUNT}<!--END_PRIVATE_REPOS_COUNT-->/s" -i README.md
      perl -0777 -pe "s/<!--PUBLIC_REPOS_COUNT-->.*?<!--END_PUBLIC_REPOS_COUNT-->/<!--PUBLIC_REPOS_COUNT-->${PUBLIC_REPOS_COUNT}<!--END_PUBLIC_REPOS_COUNT-->/s" -i README.md

      git --no-pager diff -- README.md || true

  - name: Commit & push if changed
    env:
      GIT_AUTHOR_NAME: "github-actions[bot]"
      GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
    run: |
      git config user.name "$GIT_AUTHOR_NAME"
      git config user.email "$GIT_AUTHOR_EMAIL"
      if git diff --quiet; then
        echo "No changes to commit"
      else
        git add README.md
        git commit -m "chore: update public/private repo contribution counts"
        git push
      fi
