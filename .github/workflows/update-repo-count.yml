name: Update repository contribution counts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Count repositories
        env:
          USERNAME: Shivam07042004
          GH_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
        run: |
          set -e

          echo "========================================"
          echo "GitHub Contribution Counter"
          echo "========================================"
          echo "User: $USERNAME"
          echo "From: 2021-01-01"
          echo "To: today"
          echo ""

          rm -f /tmp/year-*.json

          CURRENT_YEAR=$(date -u +%Y)

          for YEAR in $(seq 2021 "$CURRENT_YEAR"); do

            FROM="${YEAR}-01-01T00:00:00Z"

            if [ "$YEAR" -eq "$CURRENT_YEAR" ]; then
              TO="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            else
              TO="$((YEAR + 1))-01-01T00:00:00Z"
            fi

            echo "Checking year: $YEAR"

            gh api graphql \
              -f login="$USERNAME" \
              -f from="$FROM" \
              -f to="$TO" \
              -f query='query($login:String!,$from:DateTime!,$to:DateTime!){user(login:$login){contributionsCollection(from:$from,to:$to){commitContributionsByRepository{repository{nameWithOwner isPrivate} contributions{totalCount}}}}}' \
              > "/tmp/year-${YEAR}.json"

            if jq -e '.errors' "/tmp/year-${YEAR}.json" >/dev/null; then
              echo "GraphQL error for year $YEAR:"
              jq '.errors' "/tmp/year-${YEAR}.json"
              exit 1
            fi

          done

          echo ""
          echo "========================================"
          echo "Combining repository data"
          echo "========================================"

          jq -s '
            map(
              .data.user.contributionsCollection.commitContributionsByRepository[]
            )
          ' /tmp/year-*.json > /tmp/all_contributions.json

          PUBLIC_COUNT=$(jq '
            [
              .[]
              | select(.repository.isPrivate == false)
              | .repository.nameWithOwner
            ]
            | unique
            | length
          ' /tmp/all_contributions.json)

          PRIVATE_COUNT=$(jq '
            [
              .[]
              | select(.repository.isPrivate == true)
              | .repository.nameWithOwner
            ]
            | unique
            | length
          ' /tmp/all_contributions.json)

          echo ""
          echo "========================================"
          echo "RESULT"
          echo "========================================"
          echo "Public repositories:  $PUBLIC_COUNT"
          echo "Private repositories: $PRIVATE_COUNT"
          echo "========================================"

          sed -i "s/<!--PRIVATE_REPOS_COUNT-->.*<!--END_PRIVATE_REPOS_COUNT-->/<!--PRIVATE_REPOS_COUNT-->${PRIVATE_COUNT}<!--END_PRIVATE_REPOS_COUNT-->/" README.md

          sed -i "s/<!--PUBLIC_REPOS_COUNT-->.*<!--END_PUBLIC_REPOS_COUNT-->/<!--PUBLIC_REPOS_COUNT-->${PUBLIC_COUNT}<!--END_PUBLIC_REPOS_COUNT-->/" README.md

          echo ""
          echo "README updated:"
          grep "PRIVATE_REPOS_COUNT" README.md
          grep "PUBLIC_REPOS_COUNT" README.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "chore: update repository contribution counts"

          git push
