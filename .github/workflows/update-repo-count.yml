name: Update repo contribution counts
on:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC
  workflow_dispatch:

jobs:
  update-counts:
    runs-on: ubuntu-latest
    env:
      GITHUB_USER: "Shivam07042004"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prep (install tools)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq python3

      - name: Query GitHub GraphQL for counts
        env:
          TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          GITHUB_USER: ${{ env.GITHUB_USER }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "ERROR: secret PERSONAL_TOKEN is not set"
            exit 1
          fi

          PAYLOAD=$(printf '%s' '{"query":"query { user(login: \"%s\") { private: repositoriesContributedTo(privacy:PRIVATE) { totalCount } public: repositoriesContributedTo(privacy:PUBLIC) { totalCount } } }"}' "$GITHUB_USER")
          resp=$(curl -s -H "Authorization: bearer $TOKEN" -X POST -d "$PAYLOAD" https://api.github.com/graphql)
          echo "API response (first 300 chars):"
          echo "${resp:0:300}"
          private_count=$(echo "$resp" | jq -r '.data.user.private.totalCount // 0')
          public_count=$(echo "$resp" | jq -r '.data.user.public.totalCount // 0')

          echo "PRIVATE_REPOS_COUNT=$private_count" >> $GITHUB_ENV
          echo "PUBLIC_REPOS_COUNT=$public_count" >> $GITHUB_ENV
          echo "Found private: $private_count, public: $public_count"

      - name: Update README placeholders (Python safe replace)
        env:
          PRIVATE_REPOS_COUNT: ${{ env.PRIVATE_REPOS_COUNT }}
          PUBLIC_REPOS_COUNT: ${{ env.PUBLIC_REPOS_COUNT }}
        run: |
          set -euo pipefail
          if [ ! -f README.md ]; then
            echo "README.md not found"
            exit 1
          fi

          python3 - <<'PY'
import os, re
p = 'README.md'
with open(p, 'r', encoding='utf-8') as f:
    s = f.read()
s = re.sub(r'<!--PRIVATE_REPOS_COUNT-->.*?<!--END_PRIVATE_REPOS_COUNT-->',
           f'<!--PRIVATE_REPOS_COUNT-->{os.environ.get("PRIVATE_REPOS_COUNT","0")}<!--END_PRIVATE_REPOS_COUNT-->', s, flags=re.S)
s = re.sub(r'<!--PUBLIC_REPOS_COUNT-->.*?<!--END_PUBLIC_REPOS_COUNT-->',
           f'<!--PUBLIC_REPOS_COUNT-->{os.environ.get("PUBLIC_REPOS_COUNT","0")}<!--END_PUBLIC_REPOS_COUNT-->', s, flags=re.S)
with open(p, 'w', encoding='utf-8') as f:
    f.write(s)
print("README updated locally")
PY

      - name: Commit & push if changed (use PAT)
        env:
          PERSONAL_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git add README.md
          git commit -m "chore: update public/private repo contribution counts"
          git remote set-url origin https://x-access-token:${PERSONAL_TOKEN}@github.com/${GITHUB_REPOSITORY}
          branch=${GITHUB_REF#refs/heads/}
          git push origin HEAD:${branch}
