name: Update commit counts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Count commits
        env:
          USERNAME: Shivam07042004
          GH_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
        run: |
          set -uo pipefail

          FROM_DATE="2021-01-01T00:00:00Z"
          TO_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          echo "========================================"
          echo "GitHub Commit Counter"
          echo "========================================"
          echo "User: $USERNAME"
          echo "From: $FROM_DATE"
          echo "To:   $TO_DATE"
          echo ""

          # --------------------------------------------------
          # Verify token
          # --------------------------------------------------

          AUTH_USER=$(gh api user --jq '.login')

          if [ "$AUTH_USER" != "$USERNAME" ]; then
            echo "ERROR: PAT belongs to $AUTH_USER, expected $USERNAME"
            exit 1
          fi

          echo "Authenticated GitHub account: $AUTH_USER"
          echo "Token authentication: OK"
          echo ""

          # --------------------------------------------------
          # Get all repositories accessible to the PAT
          # --------------------------------------------------

          echo "Fetching repositories..."

          gh api \
            --paginate \
            -H "Accept: application/vnd.github+json" \
            "/user/repos?affiliation=owner,collaborator,organization_member&visibility=all&per_page=100" \
            --jq '.[] | {
              nameWithOwner: .full_name,
              isPrivate: .private
            }' \
            > /tmp/repos.jsonl

          REPO_COUNT=$(wc -l < /tmp/repos.jsonl)

          echo "Total repositories visible to token: $REPO_COUNT"
          echo ""

          # --------------------------------------------------
          # Counters
          # --------------------------------------------------

          PUBLIC_COMMITS=0
          PRIVATE_COMMITS=0

          PUBLIC_REPOS_WITH_COMMITS=0
          PRIVATE_REPOS_WITH_COMMITS=0

          # --------------------------------------------------
          # Check every repository
          # --------------------------------------------------

          while IFS= read -r REPO; do

            FULL_NAME=$(echo "$REPO" | jq -r '.nameWithOwner')
            IS_PRIVATE=$(echo "$REPO" | jq -r '.isPrivate')

            echo "Checking: $FULL_NAME"

            # GitHub's commits endpoint returns commits authored
            # by the specified GitHub username.
            #
            # We use --paginate so repositories with more than
            # 100 commits are fully counted.

            TEMP_FILE=$(mktemp)

            if gh api \
              --paginate \
              -H "Accept: application/vnd.github+json" \
              "/repos/${FULL_NAME}/commits?author=${USERNAME}&since=${FROM_DATE}&until=${TO_DATE}&per_page=100" \
              > "$TEMP_FILE" 2>/tmp/commit_error; then

              COMMIT_COUNT=$(jq -s 'map(.[]) | length' "$TEMP_FILE")

            else

              echo "  GitHub API error:"
              cat /tmp/commit_error
              echo "  Treating this repository as 0 commits."

              COMMIT_COUNT=0

            fi

            rm -f "$TEMP_FILE"

            echo "  Commits: $COMMIT_COUNT"

            # ------------------------------------------------
            # Add to totals
            # ------------------------------------------------

            if [ "$IS_PRIVATE" = "true" ]; then

              PRIVATE_COMMITS=$((PRIVATE_COMMITS + COMMIT_COUNT))

              if [ "$COMMIT_COUNT" -gt 0 ]; then
                PRIVATE_REPOS_WITH_COMMITS=$((PRIVATE_REPOS_WITH_COMMITS + 1))
              fi

            else

              PUBLIC_COMMITS=$((PUBLIC_COMMITS + COMMIT_COUNT))

              if [ "$COMMIT_COUNT" -gt 0 ]; then
                PUBLIC_REPOS_WITH_COMMITS=$((PUBLIC_REPOS_WITH_COMMITS + 1))
              fi

            fi

          done < /tmp/repos.jsonl

          # --------------------------------------------------
          # Final totals
          # --------------------------------------------------

          TOTAL_COMMITS=$((PUBLIC_COMMITS + PRIVATE_COMMITS))
          TOTAL_REPOS=$((PUBLIC_REPOS_WITH_COMMITS + PRIVATE_REPOS_WITH_COMMITS))

          echo ""
          echo "========================================"
          echo "FINAL RESULTS"
          echo "========================================"
          echo ""
          echo "Public commits:       $PUBLIC_COMMITS"
          echo "Private commits:      $PRIVATE_COMMITS"
          echo "Total commits:        $TOTAL_COMMITS"
          echo ""
          echo "Public repositories:  $PUBLIC_REPOS_WITH_COMMITS"
          echo "Private repositories: $PRIVATE_REPOS_WITH_COMMITS"
          echo "Total repositories:   $TOTAL_REPOS"
          echo ""

          # --------------------------------------------------
          # Update README
          # --------------------------------------------------

          sed -i \
            "s/<!--PRIVATE_COMMITS_COUNT-->.*<!--END_PRIVATE_COMMITS_COUNT-->/<!--PRIVATE_COMMITS_COUNT-->${PRIVATE_COMMITS}<!--END_PRIVATE_COMMITS_COUNT-->/" \
            README.md

          sed -i \
            "s/<!--PUBLIC_COMMITS_COUNT-->.*<!--END_PUBLIC_COMMITS_COUNT-->/<!--PUBLIC_COMMITS_COUNT-->${PUBLIC_COMMITS}<!--END_PUBLIC_COMMITS_COUNT-->/" \
            README.md

          sed -i \
            "s/<!--TOTAL_COMMITS_COUNT-->.*<!--END_TOTAL_COMMITS_COUNT-->/<!--TOTAL_COMMITS_COUNT-->${TOTAL_COMMITS}<!--END_TOTAL_COMMITS_COUNT-->/" \
            README.md

          # --------------------------------------------------
          # Commit changes
          # --------------------------------------------------

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to README."
            exit 0
          fi

          git commit -m "chore: update commit counts"
          git push
