name: Update repo contribution counts

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-counts:
    runs-on: ubuntu-latest

    env:
      GITHUB_USER: "Shivam07042004"

    steps:
      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # Get contribution counts and update README
      # --------------------------------------------------
      - name: Update README
        env:
          PERSONAL_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          GITHUB_USER: ${{ env.GITHUB_USER }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import sys
          import json
          import re
          import urllib.request
          import urllib.error

          # --------------------------------------------------
          # Configuration
          # --------------------------------------------------

          token = os.getenv("PERSONAL_TOKEN")
          login = os.getenv("GITHUB_USER")

          if not token:
              print("ERROR: PERSONAL_TOKEN secret is not set")
              sys.exit(1)

          if not login:
              print("ERROR: GITHUB_USER is not set")
              sys.exit(1)

          print(f"Checking GitHub contributions for: {login}")

          # --------------------------------------------------
          # GraphQL query
          # --------------------------------------------------

          query = """
          query($login: String!) {
            user(login: $login) {
              login
              name
              repositoriesContributedTo(
                first: 1
                privacy: PUBLIC
              ) {
                totalCount
              }

              repositoriesContributedToPrivate: repositoriesContributedTo(
                first: 1
                privacy: PRIVATE
              ) {
                totalCount
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {
                  "login": login
              }
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "github-actions-repo-counter"
              }
          )

          # --------------------------------------------------
          # Call GitHub GraphQL API
          # --------------------------------------------------

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read().decode("utf-8")

          except urllib.error.HTTPError as error:
              error_body = error.read().decode("utf-8")

              print(
                  f"ERROR: GitHub API returned "
                  f"{error.code} {error.reason}"
              )

              print(error_body[:3000])
              sys.exit(1)

          except Exception as error:
              print(f"ERROR: Network request failed: {error}")
              sys.exit(1)

          # --------------------------------------------------
          # Parse response
          # --------------------------------------------------

          try:
              data = json.loads(body)
          except json.JSONDecodeError:
              print("ERROR: GitHub returned invalid JSON")
              print(body[:3000])
              sys.exit(1)

          # IMPORTANT:
          # GraphQL can return HTTP 200 even when the query
          # itself contains errors.
          # --------------------------------------------------

          if "errors" in data:
              print("ERROR: GraphQL returned errors:")

              for error in data["errors"]:
                  print(json.dumps(error, indent=2))

              sys.exit(1)

          if "data" not in data:
              print("ERROR: No data field in GraphQL response")
              print(json.dumps(data, indent=2))
              sys.exit(1)

          user = data["data"].get("user")

          if user is None:
              print(f"ERROR: GitHub user '{login}' was not found")
              sys.exit(1)

          # --------------------------------------------------
          # Get counts
          # --------------------------------------------------

          public_count = (
              user["repositoriesContributedTo"]["totalCount"]
          )

          private_count = (
              user["repositoriesContributedToPrivate"]["totalCount"]
          )

          print("----------------------------------------")
          print(f"GitHub user : {user.get('login')}")
          print(f"Public repos: {public_count}")
          print(f"Private repos: {private_count}")
          print("----------------------------------------")

          # --------------------------------------------------
          # Update README
          # --------------------------------------------------

          readme = "README.md"

          if not os.path.exists(readme):
              print("ERROR: README.md not found")
              sys.exit(1)

          with open(readme, "r", encoding="utf-8") as file:
              content = file.read()

          # --------------------------------------------------
          # Check markers exist
          # --------------------------------------------------

          private_pattern = (
              r"<!--PRIVATE_REPOS_COUNT-->.*?"
              r"<!--END_PRIVATE_REPOS_COUNT-->"
          )

          public_pattern = (
              r"<!--PUBLIC_REPOS_COUNT-->.*?"
              r"<!--END_PUBLIC_REPOS_COUNT-->"
          )

          if not re.search(private_pattern, content, flags=re.S):
              print(
                  "ERROR: Private repository markers "
                  "were not found in README.md"
              )

              print(
                  "Add this to your README:\n"
                  "<!--PRIVATE_REPOS_COUNT-->0"
                  "<!--END_PRIVATE_REPOS_COUNT-->"
              )

              sys.exit(1)

          if not re.search(public_pattern, content, flags=re.S):
              print(
                  "ERROR: Public repository markers "
                  "were not found in README.md"
              )

              print(
                  "Add this to your README:\n"
                  "<!--PUBLIC_REPOS_COUNT-->0"
                  "<!--END_PUBLIC_REPOS_COUNT-->"
              )

              sys.exit(1)

          # --------------------------------------------------
          # Replace values
          # --------------------------------------------------

          updated = re.sub(
              private_pattern,
              (
                  "<!--PRIVATE_REPOS_COUNT-->"
                  f"{private_count}"
                  "<!--END_PRIVATE_REPOS_COUNT-->"
              ),
              content,
              flags=re.S
          )

          updated = re.sub(
              public_pattern,
              (
                  "<!--PUBLIC_REPOS_COUNT-->"
                  f"{public_count}"
                  "<!--END_PUBLIC_REPOS_COUNT-->"
              ),
              updated,
              flags=re.S
          )

          # --------------------------------------------------
          # Check whether anything changed
          # --------------------------------------------------

          if updated == content:
              print("README is already up to date.")
              sys.exit(0)

          # --------------------------------------------------
          # Write README
          # --------------------------------------------------

          with open(readme, "w", encoding="utf-8") as file:
              file.write(updated)

          print("README.md updated successfully.")

          PY

      # --------------------------------------------------
      # Configure Git
      # --------------------------------------------------
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # --------------------------------------------------
      # Commit changes
      # --------------------------------------------------
      - name: Commit changes
        run: |
          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update repository contribution counts"

      # --------------------------------------------------
      # Push changes
      # --------------------------------------------------
      - name: Push changes
        run: |
          git push
