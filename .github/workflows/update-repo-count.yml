name: Update repo contribution counts

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-counts:
    runs-on: ubuntu-latest

    env:
      GITHUB_USER: "Shivam07042004"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get repository contribution counts
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
        run: |
          set -euo pipefail

          echo "Checking GitHub contributions for: $GITHUB_USER"

          # -----------------------------
          # Public repositories
          # -----------------------------
          gh api graphql \
            -f login="$GITHUB_USER" \
            -f query='
              query($login: String!) {
                user(login: $login) {
                  repositoriesContributedTo(
                    first: 100
                    privacy: PUBLIC
                  ) {
                    totalCount
                  }
                }
              }
            ' > /tmp/public.json

          # -----------------------------
          # Private repositories
          # -----------------------------
          gh api graphql \
            -f login="$GITHUB_USER" \
            -f query='
              query($login: String!) {
                user(login: $login) {
                  repositoriesContributedTo(
                    first: 100
                    privacy: PRIVATE
                  ) {
                    totalCount
                  }
                }
              }
            ' > /tmp/private.json

          # -----------------------------
          # Check GraphQL errors
          # -----------------------------
          if jq -e '.errors' /tmp/public.json >/dev/null; then
            echo "ERROR: Public repository GraphQL query failed"
            jq '.errors' /tmp/public.json
            exit 1
          fi

          if jq -e '.errors' /tmp/private.json >/dev/null; then
            echo "ERROR: Private repository GraphQL query failed"
            jq '.errors' /tmp/private.json
            exit 1
          fi

          # -----------------------------
          # Extract counts
          # -----------------------------
          PUBLIC_COUNT=$(jq -r \
            '.data.user.repositoriesContributedTo.totalCount // 0' \
            /tmp/public.json)

          PRIVATE_COUNT=$(jq -r \
            '.data.user.repositoriesContributedTo.totalCount // 0' \
            /tmp/private.json)

          echo ""
          echo "========================================"
          echo "GitHub user       : $GITHUB_USER"
          echo "Public repositories : $PUBLIC_COUNT"
          echo "Private repositories: $PRIVATE_COUNT"
          echo "========================================"
          echo ""

          # Make variables available to next step
          echo "PUBLIC_COUNT=$PUBLIC_COUNT" >> "$GITHUB_ENV"
          echo "PRIVATE_COUNT=$PRIVATE_COUNT" >> "$GITHUB_ENV"

      - name: Update README
        run: |
          set -euo pipefail

          echo "Updating README.md..."

          # Check that README exists
          if [ ! -f README.md ]; then
            echo "ERROR: README.md not found"
            exit 1
          fi

          # Check private marker
          if ! grep -q '<!--PRIVATE_REPOS_COUNT-->' README.md; then
            echo "ERROR: PRIVATE_REPOS_COUNT marker not found"
            exit 1
          fi

          if ! grep -q '<!--END_PRIVATE_REPOS_COUNT-->' README.md; then
            echo "ERROR: END_PRIVATE_REPOS_COUNT marker not found"
            exit 1
          fi

          # Check public marker
          if ! grep -q '<!--PUBLIC_REPOS_COUNT-->' README.md; then
            echo "ERROR: PUBLIC_REPOS_COUNT marker not found"
            exit 1
          fi

          if ! grep -q '<!--END_PUBLIC_REPOS_COUNT-->' README.md; then
            echo "ERROR: END_PUBLIC_REPOS_COUNT marker not found"
            exit 1
          fi

          # -----------------------------
          # Update private count
          # -----------------------------
          sed -i -E \
            "s/<!--PRIVATE_REPOS_COUNT-->.*<!--END_PRIVATE_REPOS_COUNT-->/<!--PRIVATE_REPOS_COUNT-->${PRIVATE_COUNT}<!--END_PRIVATE_REPOS_COUNT-->/" \
            README.md

          # -----------------------------
          # Update public count
          # -----------------------------
          sed -i -E \
            "s/<!--PUBLIC_REPOS_COUNT-->.*<!--END_PUBLIC_REPOS_COUNT-->/<!--PUBLIC_REPOS_COUNT-->${PUBLIC_COUNT}<!--END_PUBLIC_REPOS_COUNT-->/" \
            README.md

          echo ""
          echo "README updated:"
          echo "Private repositories: $PRIVATE_COUNT"
          echo "Public repositories : $PUBLIC_COUNT"
          echo ""

      - name: Show README changes
        run: |
          git diff -- README.md

      - name: Commit and push changes
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi

          git commit \
            -m "chore: update repository contribution counts"

          git push

          echo "Changes pushed successfully."
