name: Update repo contribution counts

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-counts:
    runs-on: ubuntu-latest

    env:
      GITHUB_USER: "Shivam07042004"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Query GraphQL, update README, commit & push
        env:
          PERSONAL_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          GITHUB_USER: ${{ env.GITHUB_USER }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}

        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import sys
          import json
          import re
          import urllib.request
          import urllib.error
          import subprocess

          def fail(msg):
              print("ERROR:", msg, file=sys.stderr)
              sys.exit(1)

          token = os.getenv("PERSONAL_TOKEN")
          if not token:
              fail("PERSONAL_TOKEN secret is not set")

          login = os.getenv("GITHUB_USER")
          if not login:
              fail("GITHUB_USER not set")

          query = """
          query($login:String!){
            user(login:$login){
              private: repositoriesContributedTo(privacy:PRIVATE) {
                totalCount
              }
              public: repositoriesContributedTo(privacy:PUBLIC) {
                totalCount
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {"login": login}
          }).encode("utf-8")

          req = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "update-repo-count-action"
              }
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = resp.read().decode("utf-8")
          except urllib.error.HTTPError as e:
              fail(
                  f"HTTP Error: {e.code} {e.reason} - "
                  f"{e.read().decode('utf-8')[:1000]}"
              )
          except Exception as e:
              fail(f"Network error: {e}")

          try:
              data = json.loads(body)

              if "errors" in data:
                  fail(f"GraphQL errors: {data['errors']}")

              private_count = (
                  data["data"]["user"]["private"]["totalCount"] or 0
              )
              public_count = (
                  data["data"]["user"]["public"]["totalCount"] or 0
              )

          except Exception as e:
              fail(
                  f"Unexpected GraphQL response structure: {e}\n"
                  f"Response: {body[:2000]}"
              )

          print(
              f"Counts -> private: {private_count}, "
              f"public: {public_count}"
          )

          readme = "README.md"

          if not os.path.exists(readme):
              fail("README.md not found in repo root")

          with open(readme, "r", encoding="utf-8") as f:
              s = f.read()

          s_new = re.sub(
              r"<!--PRIVATE_REPOS_COUNT-->.*?<!--END_PRIVATE_REPOS_COUNT-->",
              f"<!--PRIVATE_REPOS_COUNT-->{private_count}"
              f"<!--END_PRIVATE_REPOS_COUNT-->",
              s,
              flags=re.S
          )

          s_new = re.sub(
              r"<!--PUBLIC_REPOS_COUNT-->.*?<!--END_PUBLIC_REPOS_COUNT-->",
              f"<!--PUBLIC_REPOS_COUNT-->{public_count}"
              f"<!--END_PUBLIC_REPOS_COUNT-->",
              s_new,
              flags=re.S
          )

          if s_new == s:
              print("No README changes required")
              sys.exit(0)

          with open(readme, "w", encoding="utf-8") as f:
              f.write(s_new)

          print("README updated locally")

          repo = os.getenv("GITHUB_REPOSITORY")

          if not repo:
              fail("GITHUB_REPOSITORY not set")

          ref = os.getenv(
              "GITHUB_REF",
              "refs/heads/master"
          )

          branch = ref.split("/")[-1]

          def run(cmd):
              print("+", " ".join(cmd))
              subprocess.run(cmd, check=True)

          run(["git", "config", "user.name", "github-actions[bot]"])
          run([
              "git",
              "config",
              "user.email",
              "41898282+github-actions[bot]@users.noreply.github.com"
          ])

          run(["git", "add", readme])

          run([
              "git",
              "commit",
              "-m",
              "chore: update public/private repo contribution counts"
          ])

          remote = (
              f"https://x-access-token:{token}"
              f"@github.com/{repo}.git"
          )

          run(["git", "remote", "set-url", "origin", remote])

          run([
              "git",
              "push",
              "origin",
              f"HEAD:{branch}"
          ])

          print("Pushed changes to", branch)
          PY
