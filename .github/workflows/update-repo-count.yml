name: Update repo contribution counts
on:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC
  workflow_dispatch:

jobs:
  update-counts:
    runs-on: ubuntu-latest
    env:
      GITHUB_USER: "Shivam07042004"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure python3 is available
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3

      - name: Query GraphQL, update README, commit & push (Python)
        env:
          PERSONAL_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          GITHUB_USER: ${{ env.GITHUB_USER }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
import os, sys, json, re, subprocess, urllib.request, urllib.error

def fail(msg):
    print("ERROR:", msg, file=sys.stderr)
    sys.exit(1)

token = os.environ.get("PERSONAL_TOKEN")
if not token:
    fail("PERSONAL_TOKEN secret is not set")

login = os.environ.get("GITHUB_USER") or fail("GITHUB_USER not set")
repo = os.environ.get("GITHUB_REPOSITORY")
ref = os.environ.get("GITHUB_REF", "refs/heads/master")
branch = ref.split("/")[-1]

print("Querying GitHub GraphQL for user:", login)
query = """
query($login:String!){
  user(login:$login){
    private: repositoriesContributedTo(privacy:PRIVATE) { totalCount }
    public: repositoriesContributedTo(privacy:PUBLIC) { totalCount }
  }
}
"""
payload = {"query": query, "variables": {"login": login}}
data = json.dumps(payload).encode("utf-8")

req = urllib.request.Request("https://api.github.com/graphql", data=data, headers={
    "Authorization": f"bearer {token}",
    "Content-Type": "application/json",
    "User-Agent": "update-repo-count-action"
})

try:
    with urllib.request.urlopen(req, timeout=30) as resp:
        body = resp.read().decode("utf-8")
except urllib.error.HTTPError as e:
    fail(f"HTTP error querying GraphQL: {e.code} {e.reason} - {e.read().decode('utf-8')[:1000]}")
except Exception as e:
    fail(f"Network error querying GraphQL: {e}")

print("GraphQL response (truncated):", body[:800])
resp_json = json.loads(body)
# navigate safely to counts
try:
    private_count = resp_json["data"]["user"]["private"]["totalCount"] or 0
    public_count = resp_json["data"]["user"]["public"]["totalCount"] or 0
except Exception as e:
    fail(f"Unexpected GraphQL response structure: {e}\nFull response: {json.dumps(resp_json)[:1500]}")

print(f"Found private: {private_count}, public: {public_count}")

# Update README
readme = "README.md"
if not os.path.exists(readme):
    fail("README.md not found in repo root")

with open(readme, "r", encoding="utf-8") as f:
    s = f.read()

s_new = re.sub(r"<!--PRIVATE_REPOS_COUNT-->.*?<!--END_PRIVATE_REPOS_COUNT-->",
               f"<!--PRIVATE_REPOS_COUNT-->{private_count}<!--END_PRIVATE_REPOS_COUNT-->",
               s, flags=re.S)
s_new = re.sub(r"<!--PUBLIC_REPOS_COUNT-->.*?<!--END_PUBLIC_REPOS_COUNT-->",
               f"<!--PUBLIC_REPOS_COUNT-->{public_count}<!--END_PUBLIC_REPOS_COUNT-->",
               s_new, flags=re.S)

if s_new == s:
    print("No README changes required")
    sys.exit(0)

with open(readme, "w", encoding="utf-8") as f:
    f.write(s_new)
print("README updated locally")

# Git commit & push using PAT
def run(cmd):
    print("+", " ".join(cmd))
    subprocess.run(cmd, check=True)

run(["git", "status", "--porcelain"])
run(["git", "add", readme])
run(["git", "commit", "-m", "chore: update public/private repo contribution counts"])

# set origin URL with token for push
remote_url = f"https://x-access-token:{token}@github.com/{repo}.git"
run(["git", "remote", "set-url", "origin", remote_url])
run(["git", "push", "origin", f"HEAD:{branch}"])

print("Pushed changes to", branch)
PY
