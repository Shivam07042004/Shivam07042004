name: Update repository contribution counts

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Count repositories
        env:
          USERNAME: Shivam07042004
          GH_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
        run: |
          set -e

          echo "========================================"
          echo "GitHub Contribution Counter"
          echo "========================================"
          echo "User: $USERNAME"
          echo "From: 2025-10-01"
          echo "To: today"
          echo ""

          gh api graphql \
            -f login="$USERNAME" \
            -f from="2021-10-01T00:00:00Z" \
            -f to="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -f query='query($login:String!,$from:DateTime!,$to:DateTime!){user(login:$login){login contributionsCollection(from:$from,to:$to){commitContributionsByRepository{repository{nameWithOwner isPrivate} contributions{totalCount}}}}}' \
            > contributions.json

          echo "GraphQL response:"
          cat contributions.json
          echo ""

          if jq -e '.errors' contributions.json >/dev/null; then
            echo "GraphQL error:"
            jq '.errors' contributions.json
            exit 1
          fi

          PUBLIC_COUNT=$(jq '[.data.user.contributionsCollection.commitContributionsByRepository[] | select(.repository.isPrivate == false) | .repository.nameWithOwner] | unique | length' contributions.json)

          PRIVATE_COUNT=$(jq '[.data.user.contributionsCollection.commitContributionsByRepository[] | select(.repository.isPrivate == true) | .repository.nameWithOwner] | unique | length' contributions.json)

          echo ""
          echo "========================================"
          echo "RESULT"
          echo "========================================"
          echo "Public repositories:  $PUBLIC_COUNT"
          echo "Private repositories: $PRIVATE_COUNT"
          echo "========================================"

          sed -i "s/<!--PRIVATE_REPOS_COUNT-->.*<!--END_PRIVATE_REPOS_COUNT-->/<!--PRIVATE_REPOS_COUNT-->${PRIVATE_COUNT}<!--END_PRIVATE_REPOS_COUNT-->/" README.md

          sed -i "s/<!--PUBLIC_REPOS_COUNT-->.*<!--END_PUBLIC_REPOS_COUNT-->/<!--PUBLIC_REPOS_COUNT-->${PUBLIC_COUNT}<!--END_PUBLIC_REPOS_COUNT-->/" README.md

          echo ""
          echo "README updated:"
          grep "PRIVATE_REPOS_COUNT" README.md
          grep "PUBLIC_REPOS_COUNT" README.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "chore: update repository contribution counts"
          git push
